name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      SYNC_DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET: ci_test_secret_key_must_be_minimum_32_chars_long
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      RATE_LIMIT_AUTH_PER_MINUTE: 15
      RATE_LIMIT_CHAT_PER_MINUTE: 25
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER_CHAIN: offline
      DEMO_MODE: "false"
      ENABLE_DEMO_LOGIN: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Seed Demo Account
        run: |
          python scripts/seed_demo_account.py

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
